{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="panel narrow">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button primary">Sign in</button>
    </form>
    <p class="muted">Need an account? <a href="{% url 'register' %}">Create one</a>.</p>
</div>
{% endblock %}
