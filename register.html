{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="panel narrow">
    <h2>Create account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button primary">Register</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
</div>
{% endblock %}
